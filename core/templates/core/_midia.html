{% if midia %}
<section class="md-midia" aria-label="{{ midia.titulo }}: vídeo e narração" data-midia>
<style>
.md-midia{max-width:880px;margin:1rem auto;padding:1rem;box-sizing:border-box;background:#1F1914;color:#F3E6D3;border-radius:12px;font:16px/1.5 system-ui,sans-serif;position:relative;z-index:5}
.md-midia h2{margin:0 0 .6rem;font-size:1.05rem;color:#F3E6D3}
.md-midia video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;border-radius:8px}
.md-midia video.md-vert{max-width:320px;aspect-ratio:9/16;margin:.6rem auto 0}
.md-midia audio{display:none}
.md-midia .md-btn{margin-top:.7rem;padding:.6rem 1rem;min-height:44px;border:2px solid #EB5A3C;border-radius:8px;background:transparent;color:#F3E6D3;font:inherit;cursor:pointer;transition:background .2s}
.md-midia .md-btn:hover,.md-midia .md-btn[aria-pressed="true"]{background:#EB5A3C;color:#1F1914}
.md-midia .md-btn:focus-visible,.md-midia summary:focus-visible,.md-midia video:focus-visible{outline:3px solid #F3E6D3;outline-offset:3px}
.md-midia details{margin-top:.7rem}
.md-midia summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.md-midia .md-transc{white-space:pre-line}
@media (prefers-reduced-motion:reduce){.md-midia .md-btn{transition:none}}
</style>
<h2>{{ midia.titulo }}</h2>
{% if midia.video %}
<video controls preload="none" playsinline{% if midia.poster %} poster="{{ midia.poster.url }}"{% endif %}>
  <source src="{{ midia.video.url }}" type="video/mp4">
  {% if midia.legenda %}<track kind="captions" src="{{ midia.legenda.url }}" srclang="pt-BR" label="Português" default>{% endif %}
  Seu navegador não reproduz vídeo.
</video>
{% endif %}
{% if midia.audio %}
<button class="md-btn" type="button" data-md-ouvir aria-pressed="false">Ouvir este episódio</button>
<audio preload="none" data-md-audio>
  <source src="{{ midia.audio.url }}" type="audio/mpeg">
  {% if midia.audio_ogg %}<source src="{{ midia.audio_ogg.url }}" type="audio/ogg; codecs=opus">{% endif %}
</audio>
{% endif %}
{% if midia.vertical %}
<details>
  <summary>Versão vertical (9:16)</summary>
  <video class="md-vert" controls preload="none" playsinline><source src="{{ midia.vertical.url }}" type="video/mp4"></video>
</details>
{% endif %}
{% if midia.transcricao %}
<details>
  <summary>Transcrição</summary>
  <p class="md-transc">{{ midia.transcricao }}</p>
</details>
{% endif %}
<script>
(function(){
  var raiz=document.currentScript.parentNode, b=raiz.querySelector('[data-md-ouvir]'), a=raiz.querySelector('[data-md-audio]');
  if(!b||!a)return;
  function pausaVideos(){raiz.querySelectorAll('video').forEach(function(v){v.pause();});}
  b.addEventListener('click',function(){
    if(a.paused){pausaVideos();a.play();}else{a.pause();}
  });
  a.addEventListener('play',function(){b.setAttribute('aria-pressed','true');b.textContent='Pausar a narração';});
  a.addEventListener('pause',function(){b.setAttribute('aria-pressed','false');b.textContent='Ouvir este episódio';});
  a.addEventListener('ended',function(){b.setAttribute('aria-pressed','false');b.textContent='Ouvir este episódio';});
  raiz.querySelectorAll('video').forEach(function(v){v.addEventListener('play',function(){a.pause();});});
})();
</script>
</section>
{% endif %}
