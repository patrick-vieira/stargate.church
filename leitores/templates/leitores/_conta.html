{% if user.is_authenticated %}<span class="sg-conta{% if menu %} sg-conta--menu{% endif %}"><span class="sg-conta__mail">{{ user.email|default:user.username }}</span><form method="post" action="{% url 'leitores:sair' %}" class="sg-conta__sair">{% csrf_token %}<button class="sg-btn" type="submit" data-luz="botao">Sair</button></form></span>{% else %}<a class="sg-btn{% if menu %} sg-conta--menu{% endif %}" data-luz="botao" href="{% url 'leitores:entrar' %}">Entrar</a>{% endif %}
